<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
  .card { margin: 10px; padding: 18px; border-radius: 28px; background: rgba(28,28,32,.92); color: #fff;
          box-shadow: 0 10px 30px rgba(0,0,0,.45); display: flex; align-items: center; gap: 18px;
          animation: rise .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } }
  svg { width: 110px; height: 110px; flex: none; }
  .track { stroke: rgba(255,255,255,.14); }
  .fill { transition: stroke-dashoffset .8s ease, stroke .4s; stroke-linecap: round; }
  .name { font-size: 17px; font-weight: 600; }
  .pct { font-size: 34px; font-weight: 700; margin-top: 2px; }
  .sub { font-size: 12px; opacity: .6; }
</style>
</head>
<body>
<div class="card">
  <svg viewBox="0 0 120 120">
    <circle class="track" cx="60" cy="60" r="50" fill="none" stroke-width="10"/>
    <circle id="fill" class="fill" cx="60" cy="60" r="50" fill="none" stroke-width="10"
            transform="rotate(-90 60 60)" stroke-dasharray="314.16" stroke-dashoffset="314.16"/>
    <path d="M52 38a12 12 0 0 1 24 0v22a9 9 0 0 1-9 9v13a5 5 0 0 1-10 0V69a9 9 0 0 1-5-9z" fill="#fff" opacity=".9"/>
  </svg>
  <div>
    <div class="name" id="name"></div>
    <div class="pct" id="pct"></div>
    <div class="sub" id="sub"></div>
  </div>
</div>
<script>
  const C = 2 * Math.PI * 50;
  const color = (l) => (l <= 20 ? '#ff453a' : l <= 50 ? '#ffd60a' : '#30d158');
  orbi.onDevice(({ name, level }) => {
    document.getElementById('name').textContent = name;
    document.getElementById('pct').textContent = level + '%';
    document.getElementById('sub').textContent = level <= 20 ? 'Low battery' : 'Connected';
    const f = document.getElementById('fill');
    f.style.stroke = color(level);
    f.style.strokeDashoffset = C;
    requestAnimationFrame(() => requestAnimationFrame(() => (f.style.strokeDashoffset = C * (1 - level / 100))));
  });
</script>
</body>
</html>
